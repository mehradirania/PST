:root{

--bg-deep:#020c1b;
--bg-card:#112240;

--gold:#FFD700;
--gold-light:#ffe45e;
--gold-glow:rgba(255,215,0,.20);

--green:#00ff9d;
--red:#ff4545;

--text-main:#e6f1ff;
--text-muted:#8892b0;

--glass:rgba(17,34,64,.82);

--radius:20px;

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Inter',sans-serif;

background:#020c1b;

background-image:
linear-gradient(rgba(2,12,27,.92),rgba(2,12,27,.96)),
url("Gemini_Generated_Image_361xqc361xqc361x.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

color:var(--text-main);

overflow-x:hidden;

line-height:1.8;

transition:.35s ease;

}

body[dir="rtl"]{

font-family:'Vazirmatn',sans-serif;

}

a{

text-decoration:none;
color:inherit;

}

img{

max-width:100%;
display:block;

}

.container{

width:min(1100px,92%);
margin:auto;

}

.glass-card{

background:var(--glass);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border:1px solid rgba(255,255,255,.08);

border-radius:var(--radius);

padding:30px;

box-shadow:0 20px 60px rgba(0,0,0,.45);

margin-bottom:40px;

}
/* ===========================
   SOCIAL SIDEBAR
=========================== */

.social-sidebar{

position:fixed;

top:30px;

left:30px;

display:flex;

flex-direction:column;

gap:15px;

z-index:999;

transition:.3s;

}

body[dir="rtl"] .social-sidebar{

left:auto;

right:30px;

}

.social-link{

width:42px;

height:42px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

color:var(--text-muted);

font-size:20px;

transition:.35s;

backdrop-filter:blur(8px);

}

.social-link:hover{

transform:translateY(-4px);

color:#fff;

border-color:var(--gold);

background:rgba(255,215,0,.12);

}

.telegram:hover{

color:#29a9ea;

}

.instagram:hover{

color:#ff4f81;

}

.youtube:hover{

color:#ff3434;

}

/* ===========================
   LANGUAGE BUTTON
=========================== */

.lang-switch{

position:fixed;

top:30px;

right:30px;

padding:11px 20px;

border-radius:40px;

background:rgba(17,34,64,.82);

border:1px solid var(--gold);

color:var(--gold);

font-size:15px;

font-weight:700;

cursor:pointer;

backdrop-filter:blur(10px);

transition:.35s;

z-index:1000;

}

.lang-switch:hover{

background:var(--gold);

color:#000;

}

body[dir="rtl"] .lang-switch{

left:30px;

right:auto;

}

/* ===========================
   HERO
=========================== */

.hero{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:30px;

position:relative;

}

.hero h1{

font-size:68px;

font-family:'Orbitron',sans-serif;

font-weight:900;

letter-spacing:-2px;

color:var(--gold);

text-shadow:0 0 40px rgba(255,215,0,.30);

margin-bottom:20px;

}

.hero h2{

font-size:28px;

font-weight:300;

max-width:900px;

margin-bottom:20px;

}

.hero .subtitle{

max-width:760px;

font-size:18px;

color:var(--text-muted);

margin-bottom:40px;

}

.cta-btn{

display:inline-flex;

align-items:center;

gap:12px;

padding:16px 42px;

background:linear-gradient(135deg,#FFD700,#ffb300);

color:#000;

border-radius:40px;

font-weight:700;

font-size:18px;

transition:.35s;

box-shadow:0 15px 40px rgba(255,215,0,.25);

}

.cta-btn:hover{

transform:translateY(-5px);

box-shadow:0 25px 50px rgba(255,215,0,.35);

   }
/* ===========================
   VIDEO SECTION
=========================== */

.video-wrapper{

position:relative;

padding-bottom:56.25%;

height:0;

overflow:hidden;

border-radius:18px;

box-shadow:0 20px 40px rgba(0,0,0,.45);

}

.video-wrapper iframe{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

border:none;

}

/* ===========================
   PRICING
=========================== */

.pricing-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:35px;

margin-top:25px;

}

.price-box{

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

border:2px solid var(--gold);

background:rgba(255,215,0,.05);

}

.price-amount{

font-size:58px;

font-family:'Orbitron',sans-serif;

font-weight:900;

color:var(--gold);

margin-bottom:10px;

}

.price-label{

font-size:22px;

font-weight:700;

margin-bottom:10px;

}

.package-list{

list-style:none;

padding:0;

margin-top:15px;

}

.package-list li{

display:flex;

align-items:center;

gap:12px;

margin-bottom:18px;

font-size:17px;

}

.package-list i{

color:var(--green);

font-size:20px;

}

/* ===========================
   INFO BOXES
=========================== */

.info-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:20px;

margin-top:25px;

}

.info-box{

padding:22px;

border-radius:16px;

background:rgba(255,255,255,.03);

border-left:4px solid transparent;

transition:.3s;

}

body[dir="rtl"] .info-box{

border-left:none;

border-right:4px solid transparent;

}

.info-box:hover{

transform:translateY(-6px);

background:rgba(255,255,255,.05);

}

.section-title{

display:flex;

align-items:center;

gap:14px;

font-size:34px;

margin-bottom:22px;

color:var(--gold);

font-weight:700;

}

.section-title i{

font-size:30px;

}

/* ===========================
   BIO
=========================== */

.bio-container{

display:flex;

align-items:center;

gap:45px;

flex-wrap:wrap;

}

.bio-text{

flex:2;

}

.quote-box{

flex:1;

min-width:260px;

padding:28px;

border-radius:18px;

border:1px solid var(--gold);

background:rgba(255,215,0,.06);

position:relative;

}

.quote-box i{

position:absolute;

top:-15px;

right:20px;

font-size:28px;

color:var(--gold);

background:#020c1b;

padding:0 10px;

}

body[dir="rtl"] .quote-box i{

left:20px;

right:auto;

}

footer{

padding:50px 20px;

text-align:center;

color:#6f7c9f;

font-size:15px;

border-top:1px solid rgba(255,255,255,.08);

margin-top:70px;

}
/* ===========================
   ANALYSIS CARDS
=========================== */

.analysis-card{

margin:25px 0;

padding:22px;

border-radius:18px;

background:rgba(33,150,243,.14);

border:1px solid rgba(79,195,255,.55);

backdrop-filter:blur(12px);

transition:.35s;

}

.analysis-card:hover{

transform:translateY(-6px);

border-color:#4fc3ff;

box-shadow:0 15px 35px rgba(79,195,255,.15);

}

.analysis-card h3{

font-size:24px;

margin-bottom:12px;

color:#fff;

}

.analysis-card p{

color:#dcefff;

font-size:17px;

line-height:1.9;

}

/* ===========================
   BUY BUTTON
=========================== */

.buy-box{

margin-top:45px;

padding:35px;

border:2px solid var(--gold);

border-radius:20px;

background:rgba(255,215,0,.05);

text-align:center;

}

.buy-link{

display:inline-block;

padding:16px 34px;

border-radius:12px;

border:1px solid var(--gold);

background:rgba(255,215,0,.15);

color:var(--gold);

font-size:20px;

font-weight:700;

transition:.3s;

}

.buy-link:hover{

background:var(--gold);

color:#000;

transform:translateY(-4px);

}

.price-text{

margin-top:24px;

font-size:28px;

font-weight:700;

}

.price-text span{

color:var(--gold);

}

/* ===========================
   RESPONSIVE
=========================== */

@media(max-width:992px){

.hero h1{

font-size:46px;

}

.hero h2{

font-size:22px;

}

.section-title{

font-size:28px;

}

.pricing-grid{

grid-template-columns:1fr;

}

.bio-container{

flex-direction:column;

}

.social-sidebar{

left:20px;

top:20px;

}

body[dir="rtl"] .social-sidebar{

left:auto;

right:20px;

}

.lang-switch{

top:20px;

right:20px;

}

body[dir="rtl"] .lang-switch{

right:auto;

left:20px;

}

}

@media(max-width:600px){

.hero{

padding:20px;

}

.hero h1{

font-size:36px;

}

.hero h2{

font-size:19px;

}

.hero .subtitle{

font-size:16px;

}

.cta-btn{

font-size:16px;

padding:14px 28px;

}

.section-title{

font-size:24px;

}

.price-amount{

font-size:42px;

}

.price-label{

font-size:18px;

}

}
</style>
